<h1>Orders</h1>
<p class="lede">Read-only visibility into recent orders across your catalog.</p>

<div class="table" role="table" aria-label="Orders">
  <div class="row head"><span>Order</span><span>Customer</span><span>SKU</span><span>Qty</span><span>Total</span><span>Status</span></div>
  @for (o of orders$ | async; track o.id) {
    <div class="row" role="row">
      <span class="mono">{{ o.id }}</span>
      <span>{{ o.customer }}</span>
      <span class="mono">{{ o.sku }}</span>
      <span>{{ o.quantity }}</span>
      <span>{{ o.total | currency }}</span>
      <span><span [class]="statusClass(o.status)">{{ o.status }}</span></span>
    </div>
  }
</div>
