<form class="login" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <h1>Sign in</h1>
  <p class="lede">Seller account</p>
  @if (error()) {
    <p class="err" role="alert" data-testid="login-error">{{ error() }}</p>
  }
  <label for="username">Username</label>
  <input id="username" formControlName="username" autocomplete="username" data-testid="username" />
  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    formControlName="password"
    autocomplete="current-password"
    data-testid="password"
  />
  <button type="submit" data-testid="sign-in" [disabled]="busy()">Sign in</button>
  <p class="hint">
    No backend running? Open the app with <a href="/?demo=1">?demo=1</a> for offline demo data.
  </p>
</form>
