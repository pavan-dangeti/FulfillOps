<header class="topbar">
  <a class="brand" routerLink="/">Fulfill<span>Ops</span> <small>Seller</small></a>
  <nav>
    <a routerLink="/orders" routerLinkActive="active">Orders</a>
    <a routerLink="/inventory" routerLinkActive="active">Inventory</a>
  </nav>
  @if (auth.demo) {
    <span class="auth demo" data-testid="demo-badge" title="Offline demo data; nothing is saved">Demo data</span>
  } @else if (auth.isSignedIn()) {
    <button class="auth" data-testid="auth-toggle" (click)="signOut()">Sign out</button>
  } @else {
    <a class="auth" data-testid="auth-toggle" routerLink="/login">Sign in</a>
  }
</header>
<main>
  <router-outlet />
</main>
