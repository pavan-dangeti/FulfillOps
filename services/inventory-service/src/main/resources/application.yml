server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillops}
    username: ${DB_USER:inventory_svc}
    password: ${DB_PASSWORD:}
    hikari:
      schema: inventory_svc # search_path for every pooled connection, so plain SQL finds this service's tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: inventory_svc
  flyway:
    schemas: inventory_svc
    default-schema: inventory_svc
    # outbox/inbox live in common, so every service gets the same messaging tables
    locations: classpath:db/migration,classpath:db/messaging
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      # A message the handler threw on is retried rather than dropped; at-least-once delivery
      # plus the inbox is what makes that safe.
      enable-auto-commit: false
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

fulfillops:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/messaging,classpath:db/demo
