server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillops}
    username: ${DB_USER:payment_svc}
    password: ${DB_PASSWORD:}
    hikari:
      schema: payment_svc # search_path for every pooled connection, so plain SQL finds this service's tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: payment_svc
  flyway:
    schemas: payment_svc
    default-schema: payment_svc
  mvc:
    problemdetails:
      enabled: true

fulfillops:
  security:
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
