server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillops}
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:}
    hikari:
      schema: order_svc # search_path for every pooled connection, so plain SQL finds this service's tables
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: order_svc
  flyway:
    schemas: order_svc
    default-schema: order_svc
    # outbox/inbox live in common, so every service gets the same messaging tables
    locations: classpath:db/migration,classpath:db/messaging
    # A volume first started with the demo profile has V100 applied; started without it, that
    # migration is missing locally by design rather than by accident.
    ignore-migration-patterns: "*:missing"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      # Record-level observation, so a stalled record shows up as a span rather than as nothing.
      # The span that actually links an order together is EventDispatcher's, because that is where
      # the event's own trace context is readable; this one is for seeing the transport itself.
      observation-enabled: true
      # A message the handler threw on is retried rather than dropped; at-least-once delivery
      # plus the inbox is what makes that safe.
      enable-auto-commit: false
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

fulfillops:
  # Peers are read for two things: the price of an order, and what reconciliation compares an
  # order's own record against. Names follow the same env-var convention as JWK_SET_URI.
  inventory-url: ${INVENTORY_URL:http://localhost:8082}
  payment-url: ${PAYMENT_URL:http://localhost:8083}
  fulfilment-url: ${FULFILMENT_URL:http://localhost:8084}
  security:
    signer: true # holds the RS256 key and publishes /.well-known/jwks.json
    public-paths: /api/auth/token
  auth:
    # A blank password disables the account.
    users:
      - username: seller
        password: ${SELLER_PASSWORD:}
        roles: [SELLER]
      - username: cs
        password: ${CS_PASSWORD:}
        roles: [CS]
      # read-only feed account (no customer emails) used by the CS console's ops feed
      - username: ops
        password: ${OPS_PASSWORD:}
        roles: [OPS]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # One label to group every series by service, so the dashboard needs one set of queries
      # rather than four.
      application: ${spring.application.name}
    distribution:
      # Latency buckets for the dashboard's p50/p95/p99. Without them those panels have nothing
      # to compute a quantile from.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # 1.0 keeps every trace. Lower it for a load test: tracing every span of a burst is a real
      # cost and would otherwise be part of what the throughput number measures.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4 moved this under management.opentelemetry. With the older
          # management.otlp.tracing.endpoint the value is simply ignored and the SDK falls back to
          # http://localhost:4318 — which, inside a container, is the service itself, so spans were
          # being exported nowhere and nothing reported an error.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/messaging,classpath:db/demo
