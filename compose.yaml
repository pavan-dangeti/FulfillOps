# Local stack: `cp .env.example .env && docker compose up --build --wait`
# App ports bind to 127.0.0.1 only; Postgres is reachable only from inside the compose network.
name: fulfillops

x-jvm-service: &jvm-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redpanda:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m
  healthcheck:
    # bash's /dev/tcp instead of curl, which the JRE image doesn't guarantee
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$$SERVER_PORT && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/fulfillops
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
  # Exported even when nothing is listening. With the observability profile off, the OTLP
  # exporter has nowhere to send and logs a warning every export interval; there is no trace to
  # lose, so the failure is cosmetic. `docker compose --profile observability up` starts Jaeger.
  OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
  TRACING_SAMPLE_RATE: ${TRACING_SAMPLE_RATE:-1.0}

services:
  redpanda:
    # Kafka API, single node, no KRaft zoo to configure. Topic auto-creation is left on so the
    # saga works on a fresh `docker compose up` with no provisioning step.
    image: redpandadata/redpanda:v24.3.6
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # A port check, not a cluster check: it passes slightly before Redpanda serves requests, and
      # that is deliberate. The services connect with retries, so starting early costs a few
      # warnings in the log, whereas a stricter check that never passes would hang the stack.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fulfillops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      FULFILMENT_DB_PASSWORD: ${FULFILMENT_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "fulfillops"]
      interval: 3s
      timeout: 3s
      retries: 20

  order-service:
    <<: *jvm-service
    build: { context: ., args: { MODULE: services/order-service } }
    image: fulfillops/order-service:dev
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      DB_USER: order_svc
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      INVENTORY_URL: http://inventory-service:8082
      PAYMENT_URL: http://payment-service:8083
      FULFILMENT_URL: http://fulfilment-service:8084
      SELLER_PASSWORD: ${SELLER_PASSWORD:-}
      CS_PASSWORD: ${CS_PASSWORD:-}
      OPS_PASSWORD: ${OPS_PASSWORD:-}
    ports: ["127.0.0.1:8081:8081"]

  inventory-service:
    <<: *jvm-service
    build: { context: ., args: { MODULE: services/inventory-service } }
    image: fulfillops/inventory-service:dev
    depends_on: # verifies tokens against order-service's JWKS
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      DB_USER: inventory_svc
      JWK_SET_URI: http://order-service:8081/.well-known/jwks.json
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
    ports: ["127.0.0.1:8082:8082"]

  payment-service:
    <<: *jvm-service
    build: { context: ., args: { MODULE: services/payment-service } }
    image: fulfillops/payment-service:dev
    depends_on: # verifies tokens against order-service's JWKS
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      DB_USER: payment_svc
      JWK_SET_URI: http://order-service:8081/.well-known/jwks.json
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    ports: ["127.0.0.1:8083:8083"]

  fulfilment-service:
    <<: *jvm-service
    build: { context: ., args: { MODULE: services/fulfilment-service } }
    image: fulfillops/fulfilment-service:dev
    depends_on: # verifies tokens against order-service's JWKS
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      order-service:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      DB_USER: fulfilment_svc
      JWK_SET_URI: http://order-service:8081/.well-known/jwks.json
      DB_PASSWORD: ${FULFILMENT_DB_PASSWORD:?}
    ports: ["127.0.0.1:8084:8084"]

  cs-console:
    <<: *jvm-service
    build: { context: ., args: { MODULE: cs-console } }
    image: fulfillops/cs-console:dev
    depends_on:
      order-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      ORDER_SERVICE_URL: http://order-service:8081
      OPS_FEED_PASSWORD: ${OPS_FEED_PASSWORD:-}
    ports: ["127.0.0.1:8080:8080"]

  # --- observability --------------------------------------------------------------
  # Behind the "observability" profile so the ordinary stack stays five services:
  #   docker compose up -d --wait
  #   docker compose --profile observability up -d --wait
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      # Collector only, no query storage we care about; the UI still serves traces held in memory.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI and query API
      - "127.0.0.1:4318:4318"     # OTLP HTTP, the exporters' target
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:14269/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    environment:
      # Anonymous read-only viewer: a local demo dashboard needs no login, and this container
      # holds no data worth protecting. Never do this on a network anyone else can reach.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  promdata:
  grafanadata:
