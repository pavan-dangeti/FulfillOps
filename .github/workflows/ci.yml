name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The failure-injection suite kills services and restarts the broker, so it takes long enough
  # that it does not belong on every push. Run it on demand with chaos: true.
  workflow_dispatch:
    inputs:
      chaos:
        description: 'Also run the failure-injection suite (slow)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout: a hung `playwright install` once held a runner for GitHub's six-hour
# default before anyone noticed. Each limit is several times the job's usual duration.
jobs:
  backend:
    name: Backend (unit, integration, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts Postgres on the runner's Docker.
      - run: ./mvnw -B verify
      - name: Consumer contracts are committed as generated
        run: git diff --exit-code contracts/

  frontend:
    name: Frontend (type-check, build, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            seller-dashboard/package-lock.json
            ops-floor/package-lock.json
      - name: Seller dashboard
        working-directory: seller-dashboard
        run: |
          npm ci
          npm run format:check
          npx ng build
          npx ng test --watch=false
      - name: Ops floor
        working-directory: ops-floor
        run: |
          npm ci
          npm run build
      - name: Consumer contracts are committed as generated
        run: git diff --exit-code contracts/

  e2e:
    name: End-to-end (compose stack + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            seller-dashboard/package-lock.json
            ops-floor/package-lock.json
            e2e-tests/package-lock.json
      - run: cp .env.example .env
      - run: npm ci
        working-directory: seller-dashboard
      - run: npm ci
        working-directory: ops-floor
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e-tests
      # global-setup.ts builds and starts the compose stack on a fresh database
      - run: npx playwright test
        working-directory: e2e-tests
      - name: Each service's database role can use only its own schema
        run: scripts/check-schema-isolation.sh
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          retention-days: 7

  invariants:
    name: Ordering invariants (oversell, lost orders, double charges)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      # Deliberately without the demo profile: it seeds twelve fixture orders by inserting them
      # straight into the table, and they never went through the saga, so they would be reported
      # as violations. Starting clean is what makes the check unconditional.
      - name: Start the stack with no demo fixtures
        run: SPRING_PROFILES_ACTIVE= docker compose up -d --build --wait
      - name: 1,000 concurrent orders for 100 units must confirm exactly 100
        run: |
          ./scripts/ordering-harness.py setup --units 100
          ./scripts/ordering-harness.py storm --orders 1000 --units 100 --concurrency 100
      - name: Every invariant holds over the whole database
        run: ./scripts/ordering-harness.py check
      - name: Failure injection
        if: ${{ inputs.chaos }}
        run: ./scripts/chaos.sh
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
