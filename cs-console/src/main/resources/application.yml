server:
  port: 8080

spring:
  application:
    name: cs-console
  datasource:
    url: jdbc:h2:mem:fulfillops;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false