server:
  port: 8080
  servlet:
    session:
      # Shorter than the one-hour access token, so a session never outlives its token.
      timeout: 55m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: cs-console
  thymeleaf:
    cache: false

fulfillops:
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  ops-feed:
    username: ops
    # plaintext here; order-service holds the encoded form in OPS_PASSWORD
    password: ${OPS_FEED_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
