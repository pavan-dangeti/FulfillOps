<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${'Sign in'})}"></head>
<body>
<main>
  <form class="login" th:action="@{/login}" method="post">
    <h1>Sign in</h1>
    <p class="notice error" th:if="${param.error}">Invalid username or password.</p>
    <p class="notice" th:if="${param.logout}">You have been signed out.</p>
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus data-testid="username">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required data-testid="password">
    </label>
    <button type="submit" class="btn primary" data-testid="sign-in">Sign in</button>
  </form>
</main>
</body>
</html>
