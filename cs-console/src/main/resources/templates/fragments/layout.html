<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- console.js sends this header with every jQuery POST (Spring Security CSRF protection) -->
  <meta name="csrf-header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <meta name="csrf-token" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <title th:text="${title} + ' — FulfillOps CS'">FulfillOps CS</title>
  <link rel="stylesheet" th:href="@{/css/console.css}">
</head>
<body>
<nav th:fragment="topbar" class="topbar">
  <a class="brand" th:href="@{/}">Fulfill<span>Ops</span> <small>CS Console</small></a>
  <div class="nm">
    <a th:href="@{/orders}" class="active">Orders</a>
  </div>
  <form class="signout" th:action="@{/logout}" method="post">
    <button type="submit" class="act" data-testid="sign-out">Sign out</button>
  </form>
</nav>
</body>
</html>
